name: Realtime release candidate - .NET build and tests
on:
  push:
    branches:
      - feature/rt-notificationshub-20261109-01
  pull_request:
    branches: [develop, master]
permissions:
  contents: read
  packages: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dhole_ci
          POSTGRES_PASSWORD: dhole_ci_ephemeral
          POSTGRES_DB: realtime_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhole_ci -d realtime_ci"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      CRM_TEST_POSTGRES: "Host=127.0.0.1;Port=5432;Database=realtime_ci;Username=dhole_ci;Password=dhole_ci_ephemeral;Pooling=false"
      CRM_TEST_REDIS: "127.0.0.1:6379,abortConnect=false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Authenticate private NuGet package source when configured
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f NuGet.Config ] && grep -qi 'key="github"' NuGet.Config; then
            dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile NuGet.Config
          fi
      - name: Restore release solution
        run: |
          if [ -f NuGet.Config ]; then
            dotnet restore 'DholeCRMService.slnx' --configfile NuGet.Config
          else
            dotnet restore 'DholeCRMService.slnx'
          fi
      - name: Compile release solution
        run: dotnet build 'DholeCRMService.slnx' --configuration Release --no-restore
      - name: Run release solution tests
        run: dotnet test 'DholeCRMService.slnx' --configuration Release --no-build --verbosity normal
