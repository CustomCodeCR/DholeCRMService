name: CRM Deploy Production
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dhole-crm-production
  cancel-in-progress: false

jobs:
  deploy:
    # Fail closed: approval is a separately controlled repository variable AND
    # the production GitHub environment must require reviewers.
    if: vars.CRM_PRODUCTION_DEPLOY_APPROVED == 'true'
    runs-on: [self-hosted, linux, x64, dhole]
    environment: crm-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout production orchestration
        uses: actions/checkout@v4
        with:
          repository: CustomCodeCR/DholeSystem
          ref: master
          path: _dhole-system
      - name: Verify staging-passed commit is an ancestor of approved master
        shell: bash
        run: |
          set -euo pipefail
          marker=/opt/dhole/releases/crm/staging-success.sha
          test -r "$marker"
          staging_sha="$(cat "$marker")"
          [[ "$staging_sha" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$staging_sha" "$GITHUB_SHA"
      - name: Repeat build and tests before production
        env:
          NuGetPackageSourceCredentials_github: Username=github-actions;Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
        run: |
          set -euo pipefail
          python3 scripts/check-config.py
          dotnet restore DholeCRMService.slnx --configfile NuGet.Config
          dotnet build DholeCRMService.slnx -c Release --no-restore --warnaserror
          dotnet test DholeCRMService.slnx -c Release --no-build --logger trx
      - name: Deploy only approved CRM API/Workers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DHOLE_ENV_FILE: /opt/dhole/.env
          DHOLE_NETWORK: dhole
          DHOLE_IMAGE_TAG: latest
          COMPOSE_PROJECT: dhole
        run: bash scripts/deploy-crm.sh production
