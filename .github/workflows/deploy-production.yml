name: CRM Deploy Production
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dhole-crm-production
  cancel-in-progress: false

jobs:
  deploy:
    # No extra repository-variable switch: environment approval and the actual
    # running staging release remain the production safety checks.
    runs-on: [self-hosted, linux, x64, dhole]
    environment: crm-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout production orchestration
        uses: actions/checkout@v4
        with:
          repository: CustomCodeCR/DholeSystem
          ref: master
          path: _dhole-system
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify running staging release before production (no release directory)
        shell: bash
        run: |
          set -euo pipefail
          # Read revision from the real deployed staging containers, not a new
          # server-side file. Both environments use the existing Docker daemon.
          stage_api="$(docker ps -q --filter label=com.docker.compose.project=dhole-staging --filter label=com.docker.compose.service=crm-api)"
          stage_workers="$(docker ps -q --filter label=com.docker.compose.project=dhole-staging --filter label=com.docker.compose.service=crm-workers)"
          test -n "$stage_api" && test -n "$stage_workers"
          api_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$stage_api")"
          worker_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$stage_workers")"
          [[ "$api_revision" =~ ^[a-f0-9]{40}$ ]]
          test "$api_revision" = "$worker_revision"
          git merge-base --is-ancestor "$api_revision" "$GITHUB_SHA"
          docker exec "$stage_api" curl -fsS --max-time 5 http://127.0.0.1:8080/health/ready >/dev/null
          docker exec "$stage_workers" curl -fsS --max-time 5 http://127.0.0.1:8082/health/ready >/dev/null
      - name: Repeat build and tests before production
        env:
          NuGetPackageSourceCredentials_github: Username=github-actions;Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
        run: |
          set -euo pipefail
          python3 scripts/check-config.py
          dotnet restore DholeCRMService.slnx --configfile NuGet.Config
          dotnet build DholeCRMService.slnx -c Release --no-restore --warnaserror
          dotnet test tests/Dhole.Crm.UnitTests/Dhole.Crm.UnitTests.csproj -c Release --no-build --logger trx
      - name: Deploy only approved CRM API/Workers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DHOLE_ENV_FILE: /opt/dhole/.env
          DHOLE_NETWORK: dhole
          DHOLE_IMAGE_TAG: latest
          COMPOSE_PROJECT: dhole
        run: bash scripts/deploy-crm.sh production
