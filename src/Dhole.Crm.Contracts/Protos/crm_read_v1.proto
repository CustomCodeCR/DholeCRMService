syntax = "proto3";
package dhole.crm.v1;
option csharp_namespace = "Dhole.Crm.Contracts.V1";

service CrmAccountReadService {
  rpc GetAccountById(GetAccountByIdRequest) returns (AccountSummaryReply);
  rpc ResolveAccountByTaxId(ResolveAccountByTaxIdRequest) returns (AccountSummaryReply);
}
service CrmOpportunityReadService {
  rpc GetOpportunityById(GetOpportunityByIdRequest) returns (OpportunitySummaryReply);
  rpc GetOpportunitiesByAccount(GetOpportunitiesByAccountRequest) returns (OpportunitySummariesReply);
}
message GetAccountByIdRequest {
  string request_id = 1;
  string correlation_id = 2;
  string account_id = 3;
}
message ResolveAccountByTaxIdRequest {
  string request_id = 1;
  string correlation_id = 2;
  string country_id = 3;
  string tax_id_type_code = 4;
  string tax_id = 5;
}
message AccountSummaryReply {
  bool found = 1;
  string account_id = 2;
  string display_name = 3;
  string legal_name = 4;
  string executive_user_id = 5;
  string country_id = 6;
}
message GetOpportunityByIdRequest {
  string request_id = 1;
  string correlation_id = 2;
  string opportunity_id = 3;
}
message GetOpportunitiesByAccountRequest {
  string request_id = 1;
  string correlation_id = 2;
  string account_id = 3;
  int32 page_size = 4;
  string page_token = 5;
}
message OpportunitySummaryReply {
  bool found = 1;
  string opportunity_id = 2;
  string account_id = 3;
  string lead_id = 4;
  string title = 5;
  string executive_user_id = 6;
  string stage_id = 7;
  string commercial_status = 8;
  string currency_code = 9;
  string estimated_amount = 10;
}
message OpportunitySummariesReply {
  repeated OpportunitySummaryReply opportunities = 1;
  string next_page_token = 2;
}
